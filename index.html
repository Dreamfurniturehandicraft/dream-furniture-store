<script>
const TOTAL_PAGES = 258;
let shown = 0;
let cart = [];

/* =========================
   CATALOGUE IMAGE PATH
========================= */
function imagePath(i) {
    if (i <= 100) {
        return `images_batch_1/images/catalogue-${i}.jpg`;
    }

    if (i <= 200) {
        return `catalogue-${i}.jpg`;
    }

    return `images_batch_3/images/catalogue-${i}.jpg`;
}

/* =========================
   CATALOGUE GALLERY
========================= */
function addGallery() {

    const gallery = document.getElementById("gallery");

    const end = Math.min(
        shown + 24,
        TOTAL_PAGES
    );

    for (let i = shown + 1; i <= end; i++) {

        const card = document.createElement("div");

        card.className = "pdf-card reveal";

        card.innerHTML = `
            <img
                loading="lazy"
                src="${imagePath(i)}"
                alt="Dream Furniture Sofa Catalogue Page ${i}"
                onerror="this.style.display='none'"
            >

            <div class="pdf-label">
                Sofa Catalogue Page ${i}
            </div>
        `;

        card.onclick = function () {
            window.open(
                "dhf sofa c.pdf#page=" + i,
                "_blank"
            );
        };

        gallery.appendChild(card);
    }

    shown = end;

    const loadMore =
        document.getElementById("loadMore");

    if (shown >= TOTAL_PAGES) {
        loadMore.style.display = "none";
    } else {
        loadMore.style.display = "block";
    }

    observe();
}

/* =========================
   HEART
========================= */
function heart(button) {

    if (button.textContent === "♡") {
        button.textContent = "♥";
        button.style.color = "#bd8316";
    } else {
        button.textContent = "♡";
        button.style.color = "#111";
    }
}

/* =========================
   CART
========================= */
function addCart(name, price) {

    cart.push({
        name: name,
        price: price
    });

    document.getElementById("cartCount").textContent =
        cart.length;

    renderCart();
    openCart();
}

function renderCart() {

    const box =
        document.getElementById("cartItems");

    if (!cart.length) {

        box.innerHTML = `
            <p style="
                text-align:center;
                color:#888;
                padding:40px
            ">
                Cart is empty.
            </p>
        `;

        return;
    }

    box.innerHTML = cart.map((item, index) => `

        <div class="cartitem">

            <div>
                <b>${item.name}</b>
                <br>

                <small>
                    ₹${item.price.toLocaleString("en-IN")}
                </small>
            </div>

            <button onclick="removeCart(${index})">
                ✕
            </button>

        </div>

    `).join("");
}

function removeCart(index) {

    cart.splice(index, 1);

    document.getElementById("cartCount").textContent =
        cart.length;

    renderCart();
}

function openCart() {

    document
        .getElementById("cart")
        .classList.add("show");

    document
        .getElementById("overlay")
        .classList.add("show");
}

function closeCart() {

    document
        .getElementById("cart")
        .classList.remove("show");

    document
        .getElementById("overlay")
        .classList.remove("show");
}

/* =========================
   WHATSAPP CART ORDER
========================= */
function checkout() {

    if (!cart.length) {

        alert("Please add a sofa first.");

        return;
    }

    let message =
        "Hello Dream Furniture Handicraft,%0A%0A" +
        "I am interested in:%0A";

    cart.forEach(item => {

        message +=
            encodeURIComponent(
                "• " +
                item.name +
                " - ₹" +
                item.price.toLocaleString("en-IN")
            ) +
            "%0A";
    });

    message +=
        "%0APlease send me more details, dimensions, colours and availability.";

    window.open(
        "https://wa.me/918218364238?text=" +
        message,
        "_blank"
    );
}

/* =========================
   WHATSAPP ENQUIRY
========================= */
function sendEnquiry() {

    const name =
        document.getElementById("name").value;

    const phone =
        document.getElementById("phone").value;

    const product =
        document.getElementById("product").value;

    const requirement =
        document.getElementById("message").value;

    let message =
        "Hello Dream Furniture Handicraft,%0A%0A" +
        "Name: " + encodeURIComponent(name) +
        "%0APhone: " + encodeURIComponent(phone) +
        "%0AProduct: " + encodeURIComponent(product) +
        "%0ARequirement: " + encodeURIComponent(requirement);

    window.open(
        "https://wa.me/918218364238?text=" +
        message,
        "_blank"
    );
}

/* =========================
   SEARCH
========================= */
function filterProducts() {

    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase();

    document
        .querySelectorAll(".card")
        .forEach(card => {

            const name =
                card.dataset.name.toLowerCase();

            card.style.display =
                name.includes(search)
                    ? ""
                    : "none";
        });
}

document
    .getElementById("search")
    .addEventListener(
        "input",
        filterProducts
    );

/* =========================
   CATEGORY FILTER
========================= */
document
    .querySelectorAll(".cat")
    .forEach(category => {

        category.onclick = function () {

            document
                .querySelectorAll(".cat")
                .forEach(c =>
                    c.classList.remove("active")
                );

            category.classList.add("active");

            const filter =
                category.dataset.filter;

            document
                .querySelectorAll(".card")
                .forEach(card => {

                    if (filter === "all") {

                        card.style.display = "";

                    } else {

                        const categories =
                            card.dataset.cat.split(" ");

                        card.style.display =
                            categories.includes(filter)
                                ? ""
                                : "none";
                    }
                });

            document
                .getElementById("sofas")
                .scrollIntoView({
                    behavior: "smooth"
                });
        };
    });

/* =========================
   LOAD MORE
========================= */
document
    .getElementById("loadMore")
    .onclick = addGallery;

/* =========================
   SCROLL ANIMATION
========================= */
const observer =
    new IntersectionObserver(
        entries => {

            entries.forEach(entry => {

                if (entry.isIntersecting) {

                    entry.target.classList.add("show");

                    observer.unobserve(
                        entry.target
                    );
                }
            });

        },
        {
            threshold: 0.08
        }
    );

function observe() {

    document
        .querySelectorAll(
            ".reveal:not(.show)"
        )
        .forEach(element => {

            observer.observe(element);
        });
}

/* =========================
   START WEBSITE
========================= */

addGallery();
observe();

</script>
