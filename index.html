<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Dream Furniture Handicraft | Premium Sofas
    </title>

    <meta name="description"
          content="Dream Furniture Handicraft - Premium luxury sofas, custom furniture and modern sofa designs.">

    <style>

        /* =========================
           GLOBAL
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f5f0;
            color: #171717;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img {
            max-width: 100%;
            display: block;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 999;

            background: rgba(10,10,10,0.95);
            border-bottom: 1px solid #b88a25;
        }

        .navbar {
            max-width: 1250px;
            margin: auto;

            height: 78px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 25px;
        }

        .logo img {
            width: 220px;
        }

        .nav-links {
            display: flex;
            gap: 28px;
        }

        .nav-links a {
            color: white;
            font-size: 14px;
            font-weight: 600;

            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #e4b73d;
        }

        .whatsapp-btn {
            background: #e4b73d;
            color: #111;

            padding: 11px 17px;
            border-radius: 8px;

            font-weight: bold;

            transition: 0.3s;
        }

        .whatsapp-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(228,183,61,0.3);
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: 750px;
            padding-top: 78px;

            background:
                radial-gradient(
                    circle at 80% 50%,
                    rgba(210,160,45,0.18),
                    transparent 35%
                ),
                #090909;

            color: white;

            display: flex;
            align-items: center;
        }

        .hero-container {
            max-width: 1250px;
            width: 92%;
            margin: auto;

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        .hero-content small {
            color: #e4b73d;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .hero-content h1 {
            font-family: Georgia, serif;
            font-size: clamp(45px, 6vw, 78px);
            line-height: 1;

            margin: 20px 0;
        }

        .hero-content h1 span {
            color: #e4b73d;
        }

        .hero-content p {
            color: #c9c9c9;
            line-height: 1.8;
            max-width: 570px;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            padding: 15px 22px;
            border-radius: 9px;
            font-weight: bold;

            transition: 0.3s;
        }

        .btn-gold {
            background: #e4b73d;
            color: #111;
        }

        .btn-outline {
            border: 1px solid #e4b73d;
            color: white;
        }

        .btn:hover {
            transform: translateY(-4px);
        }

        .hero-sofa {
            height: 380px;

            border-radius: 30px;

            background:
                linear-gradient(
                    145deg,
                    #eee2cd,
                    #8d795d
                );

            box-shadow:
                0 40px 80px rgba(0,0,0,0.5);

            animation: floating 4s ease-in-out infinite;
        }

        @keyframes floating {

            0%,100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        /* =========================
           PRODUCTS
        ========================= */

        .products {
            max-width: 1250px;
            width: 92%;
            margin: auto;

            padding: 90px 0;
        }

        .section-title {
            text-align: center;
            margin-bottom: 45px;
        }

        .section-title small {
            color: #a87918;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .section-title h2 {
            font-family: Georgia, serif;
            font-size: 45px;
            margin-top: 10px;
        }

        .product-grid {
            display: grid;
            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;
        }

        .product-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;

            box-shadow:
                0 10px 35px rgba(0,0,0,0.08);

            transition: 0.4s;
        }

        .product-card:hover {
            transform: translateY(-10px);
            box-shadow:
                0 25px 50px rgba(0,0,0,0.15);
        }

        .product-image {
            height: 240px;

            background:
                linear-gradient(
                    135deg,
                    #e9dfcf,
                    #a89579
                );

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-image::after {
            content: "SOFA";
            color: rgba(0,0,0,0.15);
            font-size: 45px;
            font-weight: bold;
        }

        .product-info {
            padding: 20px;
        }

        .product-info h3 {
            font-family: Georgia, serif;
            font-size: 21px;
        }

        .product-info p {
            color: #777;
            font-size: 13px;
            line-height: 1.6;
            margin: 8px 0;
        }

        .price {
            color: #9a650d;
            font-size: 22px;
            font-weight: bold;
        }

        .order-btn {
            width: 100%;
            margin-top: 14px;

            padding: 12px;

            border: 0;
            border-radius: 8px;

            background: #e4b73d;
            color: #111;

            font-weight: bold;
            cursor: pointer;
        }

        .order-btn:hover {
            background: #c99520;
        }

        /* =========================
           CATALOGUE
        ========================= */

        .catalogue {
            background: #0b0b0b;
            color: white;

            padding: 80px 20px;
            text-align: center;
        }

        .catalogue h2 {
            font-family: Georgia, serif;
            font-size: 42px;
        }

        .catalogue p {
            color: #aaa;
            margin: 15px auto 25px;
            max-width: 650px;
        }

        /* =========================
           CONTACT
        ========================= */

        .contact {
            padding: 90px 20px;
            background: #f5f1e8;
        }

        .contact-box {
            max-width: 900px;
            margin: auto;

            text-align: center;
        }

        .contact-box h2 {
            font-family: Georgia, serif;
            font-size: 45px;
        }

        .contact-box p {
            margin: 15px 0 25px;
            color: #666;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            background: #070707;
            color: #aaa;

            padding: 30px;
            text-align: center;
        }

        footer strong {
            color: #e4b73d;
        }

        /* =========================
           MOBILE
        ========================= */

        @media(max-width:900px) {

            .nav-links {
                display: none;
            }

            .hero-container {
                grid-template-columns: 1fr;
            }

            .hero-sofa {
                display: none;
            }

            .product-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }
        }

        @media(max-width:600px) {

            .logo img {
                width: 170px;
            }

            .hero {
                min-height: 680px;
            }

            .hero-content h1 {
                font-size: 45px;
            }

            .product-grid {
                grid-template-columns: 1fr;
            }

            .section-title h2 {
                font-size: 35px;
            }
        }

    </style>
</head>

<body>

</body>
</html>
